name: Workout Telegram Reminder

on:
  schedule:
    # 16:00 UTC = 18:00 за Києвом (зимовий час) у Пн (1), Ср (3), Пт (5)
    - cron: '0 16 * * 1,3,5'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Push
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🏋️‍♂️ <b>Час тренування!</b>%0A%0AСьогодні за планом: жим стоячи, молотки, махи та кисті.%0AНе забудь запустити тренування на Apple Watch ⌚️"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML"
